<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="stabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#stabBg)"/>
  <!-- Stabilizer Chassis -->
  <rect x="70" y="60" width="260" height="190" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <!-- Front Panel -->
  <rect x="85" y="75" width="230" height="160" rx="8" fill="#334155"/>
  <!-- LED Meters -->
  <rect x="100" y="90" width="90" height="45" rx="4" fill="#0f172a"/>
  <text x="145" y="122" font-family="monospace" font-size="20" font-weight="900" fill="#22c55e" text-anchor="middle">220V</text>
  <text x="145" y="103" font-family="system-ui" font-size="8" fill="#94a3b8" text-anchor="middle">OUTPUT</text>

  <rect x="210" y="90" width="90" height="45" rx="4" fill="#0f172a"/>
  <text x="255" y="122" font-family="monospace" font-size="20" font-weight="900" fill="#ef4444" text-anchor="middle">160V</text>
  <text x="255" y="103" font-family="system-ui" font-size="8" fill="#94a3b8" text-anchor="middle">INPUT</text>

  <!-- Ventilation Grill Lines -->
  <line x1="100" y1="160" x2="300" y2="160" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="175" x2="300" y2="175" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="190" x2="300" y2="190" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Power Switch & Indicator -->
  <circle cx="120" cy="215" r="8" fill="#22c55e"/>
  <rect x="250" y="207" width="30" height="16" rx="3" fill="#dc2626"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">DIGITAL VOLTAGE STABILIZER 5kVA</text>
</svg>
