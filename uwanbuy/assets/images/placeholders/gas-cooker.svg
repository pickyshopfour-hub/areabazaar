<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#bg)"/>
  <!-- Cooker Body -->
  <rect x="40" y="70" width="320" height="180" rx="14" fill="url(#steel)" stroke="#0f172a" stroke-width="3"/>
  <rect x="55" y="85" width="290" height="120" rx="8" fill="#0f172a" opacity="0.8"/>
  <!-- Burner Grates -->
  <circle cx="120" cy="145" r="42" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="120" cy="145" r="22" fill="url(#flame)"/>
  <circle cx="120" cy="145" r="12" fill="#3b82f6"/>
  <line x1="78" y1="145" x2="162" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="120" y1="103" x2="120" y2="187" stroke="#cbd5e1" stroke-width="3"/>

  <circle cx="280" cy="145" r="42" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="280" cy="145" r="22" fill="url(#flame)"/>
  <circle cx="280" cy="145" r="12" fill="#3b82f6"/>
  <line x1="238" y1="145" x2="322" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="280" cy1="103" x2="280" y2="187" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Control Knobs -->
  <circle cx="150" cy="225" r="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="250" cy="225" r="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="200" y="290" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">GAS COOKER (AUTO-IGNITION)</text>
</svg>
