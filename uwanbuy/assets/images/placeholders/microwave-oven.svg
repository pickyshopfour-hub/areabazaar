  <text x="305" y="195" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">START</text>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">DIGITAL MICROWAVE OVEN 25L</text>
