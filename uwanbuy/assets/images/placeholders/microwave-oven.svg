  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#microBg)"/>
  <!-- Microwave Chassis -->
  <rect x="50" y="65" width="300" height="180" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <!-- Glass Door -->
