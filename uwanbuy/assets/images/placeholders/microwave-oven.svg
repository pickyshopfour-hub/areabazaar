  <!-- Buttons -->
  <circle cx="295" cy="130" r="6" fill="#475569"/>
  <circle cx="315" cy="130" r="6" fill="#475569"/>
  <circle cx="295" cy="150" r="6" fill="#475569"/>
  <circle cx="315" cy="150" r="6" fill="#475569"/>
