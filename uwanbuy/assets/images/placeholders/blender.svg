<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="blenderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/><stop offset="50%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#blenderBg)"/>
  <!-- Blender Jar -->
  <path d="M 160 50 L 240 50 L 225 170 L 175 170 Z" fill="url(#jar)" stroke="#0284c7" stroke-width="2"/>
  <!-- Lid -->
  <rect x="150" y="40" width="100" height="12" rx="4" fill="#0f172a"/>
  <!-- Handle -->
  <path d="M 235 65 C 270 65, 270 150, 220 155" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  <!-- Measurement ticks -->
  <line x1="175" y1="80" x2="185" y2="80" stroke="#0284c7" stroke-width="2"/>
  <line x1="177" y1="105" x2="187" y2="105" stroke="#0284c7" stroke-width="2"/>
  <line x1="179" y1="130" x2="189" y2="130" stroke="#0284c7" stroke-width="2"/>
  <!-- Motor Base -->
  <path d="M 170 170 L 230 170 L 250 250 L 150 250 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <!-- Speed Dial -->
  <circle cx="200" cy="210" r="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <line x1="200" y1="210" x2="200" y2="200" stroke="#e11d48" stroke-width="3"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">HIGH-SPEED BLENDER & GRINDER</text>
</svg>
