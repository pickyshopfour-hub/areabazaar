<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="acBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="acUnit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#acBg)"/>
  <!-- AC Indoor Unit -->
  <rect x="50" y="80" width="300" height="95" rx="10" fill="url(#acUnit)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Louver / Flap -->
  <rect x="65" y="145" width="270" height="20" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <!-- Hidden LED Display -->
  <rect x="270" y="105" width="45" height="24" rx="4" fill="#0f172a"/>
  <text x="292" y="122" font-family="monospace" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">18°C</text>
  <!-- Air Flow Breeze Waves -->
  <path d="M 120 180 Q 150 210 180 200 T 240 210" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 140 200 Q 170 230 200 220 T 260 230" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">INVERTER SPLIT AIR CONDITIONER (1.5HP)</text>
</svg>
