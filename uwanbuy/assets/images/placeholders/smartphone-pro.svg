      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="phoneOled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#phoneBg)"/>
  <!-- Phone Frame -->
  <rect x="145" y="30" width="110" height="225" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
