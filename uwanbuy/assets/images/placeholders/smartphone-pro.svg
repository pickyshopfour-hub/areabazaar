  <rect x="160" y="112" width="36" height="36" rx="8" fill="#10b981" opacity="0.8"/>
  <rect x="204" y="112" width="36" height="36" rx="8" fill="#f59e0b" opacity="0.8"/>
  <rect x="160" y="156" width="80" height="40" rx="8" fill="#6366f1" opacity="0.8"/>
  <!-- Home Bar -->
  <rect x="180" y="240" width="40" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">SMARTPHONE PRO MAX (256GB/5G)</text>
