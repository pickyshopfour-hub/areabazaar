<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="fridgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="inox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#fridgeBg)"/>
  <!-- Refrigerator Body -->
  <rect x="135" y="40" width="130" height="210" rx="10" fill="url(#inox)" stroke="#1e293b" stroke-width="2"/>
  <!-- Top Door (Freezer) -->
  <rect x="140" y="45" width="120" height="70" rx="6" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <rect x="145" y="75" width="6" height="30" rx="3" fill="#cbd5e1"/>
  <!-- Bottom Door (Fridge) -->
  <rect x="140" y="122" width="120" height="122" rx="6" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <rect x="145" y="135" width="6" height="50" rx="3" fill="#cbd5e1"/>
  <!-- Water Dispenser -->
  <rect x="225" y="135" width="25" height="35" rx="3" fill="#1e293b"/>
  <!-- Feet -->
  <rect x="145" y="250" width="15" height="8" rx="2" fill="#0f172a"/>
  <rect x="240" y="250" width="15" height="8" rx="2" fill="#0f172a"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">DOUBLE-DOOR REFRIGERATOR (250L)</text>
</svg>
