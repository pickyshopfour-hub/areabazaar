<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); padding: 16px; font-size: 13px; line-height: 1.5; }
    .header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .header h2 { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .header p { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 5px; color: #334155; }
    input[type="text"], textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; font-family: inherit; background: var(--card-bg); transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); ring: 2px rgba(37,99,235,0.2); }
    textarea { resize: vertical; min-height: 70px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-submit {
      width: 100%; background: var(--primary); color: #fff; border: none; padding: 10px 16px;
      font-weight: 600; font-size: 13px; border-radius: var(--radius); cursor: pointer; transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .badge { display: inline-block; padding: 3px 8px; font-size: 11px; font-weight: 600; border-radius: 999px; background: #e0f2fe; color: #0369a1; }
    .feedback { margin-top: 10px; padding: 10px; border-radius: var(--radius); font-size: 12px; display: none; }
    .feedback.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .feedback.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Edit Base Product</h2>
      <span class="badge" id="badgeRow">Row <?!= context.row || 'New' ?></span>
    </div>
    <p>Admin Control Center - Product Register</p>
  </div>

  <form id="productForm">
    <input type="hidden" id="rowIndex" value="<?!= context.row || '' ?>">
    <div class="form-group">
      <label for="productId">Product ID</label>
      <input type="text" id="productId" value="<?!= (context.data && context.data[1]) || '' ?>" placeholder="Auto-generated if blank">
    </div>
    <div class="form-group">
      <label for="productName">Product Name *</label>
      <input type="text" id="productName" value="<?!= (context.data && context.data[2]) || '' ?>" required>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label for="category">Category *</label>
        <select id="category">
          <option value="Groceries">Groceries</option>
          <option value="Gadgets">Gadgets</option>
          <option value="Fashion">Fashion</option>
          <option value="Home">Home & Living</option>
        </select>
      </div>
      <div class="form-group">
        <label for="brand">Brand</label>
        <input type="text" id="brand" value="<?!= (context.data && context.data[6]) || '' ?>">
      </div>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description"><?!= (context.data && context.data[7]) || '' ?></textarea>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label for="hasVariants">Has Variants?</label>
        <select id="hasVariants">
          <option value="TRUE">TRUE (Multi-SKU)</option>
          <option value="FALSE">FALSE (Single SKU)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="modalType">Modal View Type</label>
        <select id="modalType">
          <option value="AUCTION_INSPECT">AUCTION_INSPECT</option>
          <option value="STANDARD_DETAIL">STANDARD_DETAIL</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="status">Catalog Status</label>
      <select id="status">
        <option value="ACTIVE">ACTIVE</option>
        <option value="PENDING_APPROVAL">PENDING_APPROVAL</option>
        <option value="ARCHIVED">ARCHIVED</option>
      </select>
    </div>
    <button type="submit" class="btn-submit" id="btnSave">Save Changes to Register</button>
  </form>

  <div id="feedback" class="feedback"></div>

  <script>
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      const feedback = document.getElementById('feedback');
      btn.disabled = true;
      btn.innerText = 'Saving...';
      feedback.className = 'feedback';
      feedback.style.display = 'none';

      const payload = {
        row: document.getElementById('rowIndex').value,
        productId: document.getElementById('productId').value,
        productName: document.getElementById('productName').value,
        category: document.getElementById('category').value,
        brand: document.getElementById('brand').value,
        description: document.getElementById('description').value,
        hasVariants: document.getElementById('hasVariants').value === 'TRUE',
        modalType: document.getElementById('modalType').value,
        status: document.getElementById('status').value
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.innerText = 'Save Changes to Register';
            feedback.className = 'feedback success';
            feedback.innerText = '✓ Product successfully updated!';
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = 'Save Changes to Register';
            feedback.className = 'feedback error';
            feedback.innerText = '✗ Error: ' + err.message;
          })
          .abSaveProductRow(payload);
      } else {
        setTimeout(function() {
          btn.disabled = false;
          btn.innerText = 'Save Changes to Register';
          feedback.className = 'feedback success';
          feedback.innerText = '✓ [Simulated] Product saved successfully!';
        }, 500);
      }
    });
  </script>
</body>
</html>
