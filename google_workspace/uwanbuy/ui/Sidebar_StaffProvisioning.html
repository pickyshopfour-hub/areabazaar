<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f8fafc; --card:#fff; --primary:#7c3aed; --border:#e2e8f0; --radius:8px; }
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
    body { background: var(--bg); padding:16px; font-size:13px; color:#0f172a; }
    .header { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .header h2 { font-size:16px; font-weight:700; color:#7c3aed; }
    .form-group { margin-bottom:12px; }
    label { display:block; font-weight:600; font-size:12px; margin-bottom:4px; color:#334155; }
    input, select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:13px; background:#fff; }
    .tier-box { background:#f5f3ff; border:1px solid #ddd6fe; border-radius:var(--radius); padding:10px; margin-bottom:12px; }
    .tier-box strong { color:#5b21b6; }
    .btn-submit { width:100%; background:var(--primary); color:#fff; border:none; padding:10px; font-weight:600; border-radius:var(--radius); cursor:pointer; }
    .btn-submit:hover { background:#6d28d9; }
    .feedback { margin-top:10px; padding:10px; border-radius:var(--radius); font-size:12px; display:none; }
    .feedback.success { background:#dcfce7; color:#166534; display:block; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Provision Staff Workspace</h2>
    <p style="color:#64748b; font-size:12px;">Deploy personal staff tab or standalone workbook.</p>
  </div>
  <div class="tier-box">
    🔒 <strong>Personal Isolation Rule:</strong> Every staff member owns their *own personal workbook*. Adding a lightweight duty adds a tab inside *that staff member's personal workbook* (no multi-user shared files).
  </div>
  <form id="provForm">
    <div class="form-group">
      <label>Staff ID & Full Name</label>
      <input type="text" value="<?!= (context.data && context.data[1] + ' - ' + context.data[2]) || 'STF-012 Jane Doe' ?>" readonly style="background:#f1f5f9;">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" value="<?!= (context.data && context.data[3]) || 'staff@areabazaar.com' ?>" readonly style="background:#f1f5f9;">
    </div>
    <div class="form-group">
      <label>Target Role</label>
      <select id="role">
        <option value="ReceivingInspector">Receiving Inspector (Intake QA)</option>
        <option value="PackStationOperator">Pack Station Operator (Pack Bay)</option>
        <option value="Runner">Area Courier / Runner</option>
        <option value="OutletLead">Regional Outlet Hub Lead</option>
        <option value="WarehouseManager">Warehouse Lead Manager</option>
      </select>
    </div>
    <div class="form-group">
      <label>Workload Scope / Provisioning Tier</label>
      <select id="tier">
        <option value="TIER_1">Tier 1: Dedicated Tab inside Personal Workbook</option>
        <option value="TIER_2">Tier 2: Dedicated Standalone Google Sheet Workbook</option>
      </select>
    </div>
    <div class="form-group">
      <label>Personal Workbook Google Sheet ID</label>
      <input type="text" id="personalSheetId" placeholder="Required for Tier 1 (e.g. 1aB2c...)" value="<?!= (context.data && context.data[7]) || '' ?>">
    </div>
    <button type="submit" class="btn-submit" id="btnProv">Execute Provisioning</button>
  </form>
  <div id="feedback" class="feedback"></div>

  <script>
    document.getElementById('provForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnProv');
      btn.disabled = true;
      btn.innerText = 'Provisioning...';
      const tier = document.getElementById('tier').value;
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Execute Provisioning';
        const fb = document.getElementById('feedback');
        fb.className = 'feedback success';
        if (tier === 'TIER_1') {
          fb.innerText = '✓ Success! New locked tab provisioned inside employee\'s personal workbook.';
        } else {
          fb.innerText = '✓ Success! Dedicated standalone workbook cloned into employee\'s Google Drive folder.';
        }
      }, 600);
    });
  </script>
</body>
</html>
