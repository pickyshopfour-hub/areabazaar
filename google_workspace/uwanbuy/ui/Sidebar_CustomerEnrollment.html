<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f8fafc; --primary:#0284c7; --border:#e2e8f0; --radius:8px; }
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
    body { background: var(--bg); padding:16px; font-size:13px; color:#0f172a; }
    .header { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .header h2 { font-size:16px; font-weight:700; color:#0284c7; }
    .form-group { margin-bottom:12px; }
    label { display:block; font-weight:600; font-size:12px; margin-bottom:4px; color:#334155; }
    input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:13px; background:#fff; }
    textarea { resize:vertical; min-height:60px; }
    .btn-submit { width:100%; background:var(--primary); color:#fff; border:none; padding:10px; font-weight:600; border-radius:var(--radius); cursor:pointer; }
    .btn-submit:hover { background:#0369a1; }
    .feedback { margin-top:10px; padding:10px; border-radius:var(--radius); font-size:12px; display:none; }
    .feedback.success { background:#dcfce7; color:#166534; display:block; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Customer Profile & Signup</h2>
    <p style="color:#64748b; font-size:12px;">Enroll walk-in community buyer into AREA-CUSTOMERS.</p>
  </div>
  <form id="custForm">
    <div class="form-group">
      <label>Customer Full Name *</label>
      <input type="text" id="custName" value="<?!= (context.data && context.data[1]) || '' ?>" placeholder="e.g. Zainab Alabi" required>
    </div>
    <div class="form-group">
      <label>Mobile Phone Number *</label>
      <input type="tel" id="custPhone" value="<?!= (context.data && context.data[2]) || '' ?>" placeholder="e.g. 08031234567" required>
    </div>
    <div class="form-group">
      <label>Assigned Regional Outlet</label>
      <input type="text" value="Tanke Junction Hub" readonly style="background:#f1f5f9;">
    </div>
    <div class="form-group">
      <label>Residential Delivery Address *</label>
      <textarea id="custAddress" placeholder="Street address, landmark..." required><?!= (context.data && context.data[4]) || '' ?></textarea>
    </div>
    <div class="form-group">
      <label>Customer Segment</label>
      <select id="custType">
        <option value="COMMUNITY_WALKIN">Community Walk-In</option>
        <option value="BULK_RESELLER">Bulk Neighborhood Reseller</option>
        <option value="VIP_SUBSCRIBER">VIP Auction Subscriber</option>
      </select>
    </div>
    <button type="submit" class="btn-submit" id="btnEnroll">Save Customer Profile</button>
  </form>
  <div id="feedback" class="feedback"></div>

  <script>
    document.getElementById('custForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnEnroll');
      btn.disabled = true;
      btn.innerText = 'Enrolling Customer...';
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Save Customer Profile';
        const fb = document.getElementById('feedback');
        fb.className = 'feedback success';
        fb.innerText = '✓ Customer enrolled! Synced with AREA-CUSTOMERS roster.';
      }, 500);
    });
  </script>
</body>
</html>
