<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f8fafc; --primary:#059669; --border:#e2e8f0; --radius:8px; }
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
    body { background: var(--bg); padding:16px; font-size:13px; color:#0f172a; }
    .header { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .header h2 { font-size:16px; font-weight:700; color:#059669; }
    .form-group { margin-bottom:12px; }
    label { display:block; font-weight:600; font-size:12px; margin-bottom:4px; color:#334155; }
    input, select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:13px; background:#fff; }
    .receipt-box { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:var(--radius); padding:12px; margin-bottom:12px; }
    .total-display { font-size:18px; font-weight:800; color:#065f46; margin-top:4px; }
    .btn-submit { width:100%; background:var(--primary); color:#fff; border:none; padding:10px; font-weight:600; border-radius:var(--radius); cursor:pointer; }
    .btn-submit:hover { background:#047857; }
    .feedback { margin-top:10px; padding:10px; border-radius:var(--radius); font-size:12px; display:none; }
    .feedback.success { background:#dcfce7; color:#166534; display:block; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Walk-In POS Terminal</h2>
    <p style="color:#64748b; font-size:12px;">Instant offline order taking and cash collection.</p>
  </div>
  <div class="receipt-box">
    <div style="font-size:11px; color:#047857; font-weight:600;">CHECKOUT TOTAL AMOUNT</div>
    <div class="total-display" id="totalAmt">₦72,000</div>
  </div>
  <form id="posForm">
    <div class="form-group">
      <label>Customer Name / Phone</label>
      <input type="text" id="custRef" placeholder="e.g. 08031234567" required>
    </div>
    <div class="form-group">
      <label>Catalog Item</label>
      <select id="itemSelect" onchange="calcTotal()">
        <option value="72000" data-unit="Bag">Premium Rice 50kg (₦72,000 / Bag)</option>
        <option value="13500" data-unit="Gallon">Kings Cooking Oil 5L (₦13,500 / Gallon)</option>
        <option value="65000" data-unit="Box">Redmi Smartphone 8/256 (₦65,000 / Unit)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Quantity Ordered</label>
      <input type="number" id="qty" value="1" min="1" oninput="calcTotal()" required>
    </div>
    <div class="form-group">
      <label>Payment Method</label>
      <select id="payMode">
        <option value="CASH">Cash on Counter</option>
        <option value="POS_TERMINAL">Physical POS Card Swipe</option>
        <option value="BANK_TRANSFER">Direct Instant Transfer</option>
      </select>
    </div>
    <button type="submit" class="btn-submit" id="btnCheckout">Process Sale & Issue Receipt</button>
  </form>
  <div id="feedback" class="feedback"></div>

  <script>
    function calcTotal() {
      const price = Number(document.getElementById('itemSelect').value) || 0;
      const q = Number(document.getElementById('qty').value) || 1;
      const total = price * q;
      document.getElementById('totalAmt').innerText = '₦' + total.toLocaleString();
    }
    document.getElementById('posForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnCheckout');
      btn.disabled = true;
      btn.innerText = 'Processing Order...';
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Process Sale & Issue Receipt';
        const fb = document.getElementById('feedback');
        fb.className = 'feedback success';
        fb.innerText = '✓ Sale complete! Recorded in PROXY-SPOT-ORDERS and cash ledger.';
      }, 500);
    });
  </script>
</body>
</html>
