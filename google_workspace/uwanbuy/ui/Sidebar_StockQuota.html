<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f8fafc; --card:#fff; --primary:#4f46e5; --border:#e2e8f0; --radius:8px; }
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
    body { background: var(--bg); padding:16px; font-size:13px; color:#0f172a; }
    .header { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .header h2 { font-size:16px; font-weight:700; color:#4f46e5; }
    .form-group { margin-bottom:12px; }
    label { display:block; font-weight:600; font-size:12px; margin-bottom:4px; color:#334155; }
    input { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:13px; background:#fff; }
    .btn-submit { width:100%; background:var(--primary); color:#fff; border:none; padding:10px; font-weight:600; border-radius:var(--radius); cursor:pointer; margin-top:8px; }
    .btn-submit:hover { background:#4338ca; }
    .metric-box { background:#eef2ff; border:1px solid #c7d2fe; border-radius:var(--radius); padding:10px; margin-bottom:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .metric-val { font-size:15px; font-weight:700; color:#312e81; }
    .feedback { margin-top:10px; padding:10px; border-radius:var(--radius); font-size:12px; display:none; }
    .feedback.success { background:#dcfce7; color:#166534; display:block; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Adjust Capacity Quota</h2>
    <p style="color:#64748b; font-size:12px;">Cap sellable session units per warehouse zone.</p>
  </div>
  <div class="metric-box">
    <div>
      <span style="font-size:11px; color:#4338ca; font-weight:600;">LIVE COMMITTED</span>
      <div class="metric-val" id="committedVal"><?!= (context.data && context.data[7]) || '0' ?> Units</div>
    </div>
    <div>
      <span style="font-size:11px; color:#4338ca; font-weight:600;">AVAILABLE CAP</span>
      <div class="metric-val" id="remainingVal"><?!= (context.data && context.data[8]) || '0' ?> Units</div>
    </div>
  </div>
  <form id="quotaForm">
    <input type="hidden" id="rowIndex" value="<?!= context.row || '' ?>">
    <div class="form-group">
      <label>Warehouse Zone</label>
      <input type="text" value="<?!= (context.data && context.data[2]) || 'WHZ-01' ?>" readonly style="background:#f1f5f9;">
    </div>
    <div class="form-group">
      <label>New Capacity Quota</label>
      <input type="number" id="newQuota" value="<?!= (context.data && context.data[5]) || '100' ?>" min="1" required>
    </div>
    <div class="form-group">
      <label>Minimum Order Quantity (MOQ)</label>
      <input type="number" id="moq" value="<?!= (context.data && context.data[6]) || '1' ?>" min="1" required>
    </div>
    <button type="submit" class="btn-submit" id="btnSave">Save Adjusted Quota</button>
  </form>
  <div id="feedback" class="feedback"></div>

  <script>
    document.getElementById('quotaForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = 'Updating Quota...';
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Save Adjusted Quota';
        const fb = document.getElementById('feedback');
        fb.className = 'feedback success';
        fb.innerText = '✓ Capacity quota updated in STOCK-SCHEDULE!';
      }, 500);
    });
  </script>
</body>
</html>
