<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f8fafc; --primary:#ca8a04; --border:#e2e8f0; --radius:8px; }
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
    body { background: var(--bg); padding:16px; font-size:13px; color:#0f172a; }
    .header { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .header h2 { font-size:16px; font-weight:700; color:#a16207; }
    .form-group { margin-bottom:12px; }
    label { display:block; font-weight:600; font-size:12px; margin-bottom:4px; color:#334155; }
    input, select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:13px; background:#fff; }
    .btn-submit { width:100%; background:var(--primary); color:#fff; border:none; padding:10px; font-weight:600; border-radius:var(--radius); cursor:pointer; }
    .btn-submit:hover { background:#a16207; }
    .manifest-box { background:#fefce8; border:1px solid #fef08a; border-radius:var(--radius); padding:10px; margin-bottom:12px; font-size:12px; }
    .feedback { margin-top:10px; padding:10px; border-radius:var(--radius); font-size:12px; display:none; }
    .feedback.success { background:#dcfce7; color:#166534; display:block; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Carrier Manifest & Waybill</h2>
    <p style="color:#64748b; font-size:12px;">Line-haul carrier dispatch to regional outlets.</p>
  </div>
  <div class="manifest-box">
    <div><strong>Manifest ID:</strong> <?!= (context.data && context.data[1]) || 'MAN-TANKE-20261024-01' ?></div>
    <div><strong>Destination:</strong> <?!= (context.data && context.data[2]) || 'Tanke Regional Hub' ?></div>
    <div><strong>Consolidated Parcels:</strong> <strong style="color:#a16207;"><?!= (context.data && context.data[4]) || '45 Parcels' ?></strong></div>
  </div>
  <form id="carrierForm">
    <div class="form-group">
      <label>Assigned ZBDP Carrier Partner</label>
      <select id="carrierSelect">
        <option value="ZBDP-KWARA-EXPRESS">ZBDP-KWARA-EXPRESS (Kwara Line Haul Co)</option>
        <option value="ZBDP-ALBARIKA">ZBDP-ALBARIKA (Albarika Transit)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Vehicle Plate Number</label>
      <input type="text" id="plateNumber" placeholder="e.g. KWL-452-XA" required>
    </div>
    <div class="form-group">
      <label>Driver Full Name & Phone Number</label>
      <input type="text" id="driverDetails" placeholder="e.g. Musa Ibrahim (08023456789)" required>
    </div>
    <div class="form-group">
      <label>Admin Departure Clearance</label>
      <input type="text" value="CLEARED (Security Check Passed)" readonly style="background:#f1f5f9; color:#15803d; font-weight:600;">
    </div>
    <button type="submit" class="btn-submit" id="btnDispatch">Issue Waybill & Dispatch Carrier</button>
  </form>
  <div id="feedback" class="feedback"></div>

  <script>
    document.getElementById('carrierForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnDispatch');
      btn.disabled = true;
      btn.innerText = 'Dispatching Vehicle...';
      setTimeout(function() {
        btn.disabled = false;
        btn.innerText = 'Issue Waybill & Dispatch Carrier';
        const fb = document.getElementById('feedback');
        fb.className = 'feedback success';
        fb.innerText = '✓ Carrier waybill generated! Parcels advanced to [zbd-transit].';
      }, 500);
    });
  </script>
</body>
</html>
