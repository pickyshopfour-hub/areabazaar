<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
            background: #fdfdfd;
            font-size: 13px;
        }

        .section-title {
            font-weight: 700;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }

        .box-input {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px;
        }

        .btn-submit {
            background: #1e293b;
            color: white;
            font-weight: 700;
            border-radius: 8px;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
        }

        .btn-start {
            background: #0ea5e9;
            color: white;
        }

        .btn-clear {
            background: #64748b;
            color: white;
        }

        .uneditable {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div id="main-form">
        <div class="card p-3 shadow-sm border-0 mb-3">
            <label class="form-label">Auction Session ID</label>
            <div class="input-group mb-2">
                <input type="number" id="auction_session_id" class="form-control" value="1">
            </div>
            <div class="row g-2">
                <div class="col-6"><button id="btnStart" class="btn btn-start w-100 btn-sm" onclick="initReport()">Start
                        Report</button></div>
                <div class="col-6"><button id="btnClear" class="btn btn-clear w-100 btn-sm"
                        onclick="confirmClear()">Clear All</button></div>
            </div>
        </div>

        <div id="prep-fields" class="">
            <div class="section-title">Logistics & Resources</div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label">Labels</label>
                    <input type="number" id="labels" class="form-control box-input" placeholder="0">
                </div>
                <div class="col-6">
                    <label class="form-label">Packs</label>
                    <input type="number" id="packs" class="form-control box-input" placeholder="0">
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label">Boxes</label>
                    <input type="number" id="boxes" class="form-control box-input" placeholder="0">
                </div>
                <div class="col-6">
                    <label class="form-label">Helper HR</label>
                    <input type="number" id="hr_count" class="form-control box-input" placeholder="0">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Manpower Details</label>
                <textarea id="manpower_details" class="form-control box-input" rows="2"></textarea>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label">Transport Cap (KG)</label>
                    <input type="number" id="transport_kg" class="form-control box-input" placeholder="0">
                </div>
                <div class="col-6">
                    <label class="form-label">Warehouse ID</label>
                    <input type="text" id="warehouse_zone_id" class="form-control box-input" placeholder="e.g. LAG-01">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Transport Providers</label>
                <textarea id="transport_providers" class="form-control box-input" rows="2"></textarea>
            </div>

            <div class="section-title">Conditions & Assessment</div>
            <div class="mb-2">
                <label class="form-label">Security Condition</label>
                <select id="security_cond" class="form-select box-input">
                    <option value="stable">Stable</option>
                    <option value="unstable">Unstable</option>
                    <option value="shaky">Shaky</option>
                    <option value="unsure">Unsure</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Security Notes</label>
                <textarea id="security_notes" class="form-control box-input" rows="2"></textarea>
            </div>
            <div class="mb-2">
                <label class="form-label">Weather Condition</label>
                <select id="weather_cond" class="form-select box-input">
                    <option value="stable">Stable</option>
                    <option value="unstable">Unstable</option>
                    <option value="shaky">Shaky</option>
                    <option value="unsure">Unsure</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">General Assessment</label>
                <select id="assessment" class="form-select box-input fw-bold text-primary">
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="hopeful">Hopeful</option>
                    <option value="bleak">Bleak</option>
                    <option value="unfit">Unfit</option>
                </select>
            </div>

            <div class="section-title">Internal Tracking</div>
            <div class="mb-2">
                <label class="form-label">WHM Staff ID</label>
                <input type="number" id="whm_staff_id" class="form-control box-input" value="10">
            </div>

            <button id="btnSubmit" class="btn btn-submit" onclick="submitPrepReport()">
                <i class="fa fa-paper-plane me-2"></i> SUBMIT MASTER PREPCHECK
            </button>
        </div>

        <div id="status" class="mt-3 text-center small"></div>
    </div>

    <script>
        function initReport() {
            const sid = document.getElementById('auction_session_id').value;
            document.getElementById('status').innerText = 'Initializing...';
            document.getElementById('btnStart').disabled = true;

            google.script.run
                .withSuccessHandler((res) => {
                    document.getElementById('status').innerHTML = '<span class="text-success">Report Initialized</span>';
                })
                .startReport(sid);
        }

        function confirmClear() {
            if (confirm('Verify: Clear all data and reset form?')) {
                google.script.run.clearAll();
                document.getElementById('btnStart').disabled = false;
                document.getElementById('status').innerText = '';
            }
        }

        function submitPrepReport() {
            const formData = {
                auction_session_id: document.getElementById('auction_session_id').value,
                warehouse_zone_id: document.getElementById('warehouse_zone_id').value,
                whm_staff_id: document.getElementById('whm_staff_id').value,
                labels: document.getElementById('labels').value,
                packs: document.getElementById('packs').value,
                boxes: document.getElementById('boxes').value,
                hr_count: document.getElementById('hr_count').value,
                manpower_details: document.getElementById('manpower_details').value,
                transport_kg: document.getElementById('transport_kg').value,
                transport_providers: document.getElementById('transport_providers').value,
                security_cond: document.getElementById('security_cond').value,
                security_notes: document.getElementById('security_notes').value,
                weather_cond: document.getElementById('weather_cond').value,
                assessment: document.getElementById('assessment').value,
                timestamp: new Date().toISOString()
            };

            document.getElementById('status').innerText = 'Archiving and Submitting...';

            google.script.run
                .withSuccessHandler((res) => {
                    document.getElementById('status').innerHTML = '<span class="text-success fw-bold">SUBMISSION SUCCESSFUL</span><br><a href="' + res.archiveUrl + '" target="_blank">View Archive</a>';
                    document.getElementById('prep-fields').classList.add('uneditable');
                    document.getElementById('btnSubmit').style.display = 'none';
                })
                .submitPrepCheck(formData);
        }
    </script>
</body>

</html>
